#############################  Display  #############################

# Verbose program output
# Accepts log level: "error", "warn", "info", "debug", "trace"
verbose = "trace"

# Don't show interactive progress bar while checking links.
no_progress = false

# Path to summary output file.
#output = "./lychee2/out.md"

#############################  Cache  ###############################

# Enable link caching. This can be helpful to avoid checking the same links on
# multiple runs.
#cache = true

# Discard all cached requests older than this duration.
#max_cache_age = "2d"

#############################  Runtime  #############################

# Number of threads to utilize.
# Defaults to number of cores available to the system if omitted.
threads = 6

# Maximum number of allowed redirects.
max_redirects = 10

# Maximum number of allowed retries before a link is declared dead.
max_retries = 3

# Maximum number of concurrent link checks.
max_concurrency = 30

#############################  Requests  ############################

# User agent to send with each request.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"

# Website timeout from connect to response finished.
timeout = 30

# Minimum wait time in seconds between retries of failed requests.
retry_wait_time = 3

# Comma-separated list of accepted status codes for valid links.
# Supported values are:
#
# accept = ["200..=204", "429"]
# accept = "200..=204, 429"
# accept = ["200", "429"]
# accept = "200, 429"
accept = ["200", "429", "403", "418", "402"]

# Proceed for server connections considered insecure (invalid TLS).
insecure = true

# Only test links with the given schemes (e.g. https).
# Omit to check links with any other scheme.
# At the moment, we support http, https, file, and mailto.
#scheme = ["https"]

# When links are available using HTTPS, treat HTTP links as errors.
#require_https = false

# Request method
method = "get"

# Custom request headers
# headers = []

# Remap URI matching pattern to different URI.
# remap = ["https://example.com http://example.invalid"]

# Base URL or website root directory to check relative URLs.
# base = "https://example.com"

# HTTP basic auth support. This will be the username and password passed to the
# authorization HTTP header. See
# <https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Authorization>
#basic_auth = ["example.com user:pwd"]

#############################  Exclusions  ##########################

# Skip missing input files (default is to error if they don't exist).
skip_missing = false

# Check links inside `<code>` and `<pre>` blocks as well as Markdown code
# blocks.
include_verbatim = true

# Ignore case of paths when matching glob patterns.
glob_ignore_case = false

# Exclude URLs and mail addresses from checking (supports regex).
exclude = [
    # 原有排除项
    '.*ip:.*', '.*ftp.freebsd.org.*', '.*localhost.*', '.*\$.*', '.*0\.0\.0\.0.*', 'http://ip/.*',
    # 镜像站对脚本请求返回 302 循环重定向，仅排除正文实际引用的路径
    '^https?://mirrors?\.nju\.edu\.cn/(gentoo|freebsd|freebsd-pkg|freebsd-ports|github-release)(/|$)',
    '^https?://mirrors?\.nju\.edu\.cn/$',
    '^https?://mirrors\.jlu\.edu\.cn/archlinuxarm/os/ArchLinuxARM-rpi-aarch64-latest\.tar\.gz$',
    '^https?://movie\.douban\.com/subject/(1291843|25932086)/?$',
    '^https?://www\.dib\.ie/biography/berkeley-george-a0611$',
    # 防盗链与反爬站点，仅排除正文实际引用的路径
    '^https?://([^/]+\.)?bilibili\.com/(video|read|bangumi)/',
    '^https?://gitee\.com/openharmony/kernel_liteos_a(/|$)',
    '^https?://gitlab\.gnome\.org/World/ShellExtensions/desktop-icons(/|$)',
    '^https?://www\.imdb\.com/title/tt3042408(/|$)',
    '^https?://berkeleyplaques\.org/plaque/how-berkeley-got-its-name(/|$)',
    '^https?://digicoll\.lib\.berkeley\.edu/record/81096(/|$)',
    '^https?://www\.st\.com/en/development-tools/stm32cubemx\.html$',
    '^https?://www\.olympics\.com/ioc/news/-faster-higher-stronger-together-ioc-session-approves-historic-change-in-olympic-motto$',
    '^https?://play\.google\.com/store/apps/details\?id=com\.sonelli\.juicessh$',
    # 响应过慢或持续 5xx 的站点，仅排除正文实际引用的页面
    '^https?://www\.mckusick\.com/($|beastie/|buylist\.html)',
    '^https?://www\.opensound\.com/bsd\.html$',
    '^https?://www\.dragonflybsd\.org/donations/?$',
    '^https?://yooer\.me/(宝塔面板|%E5%AE%9D)',
    '^https?://src\.uniontech\.com/#?/security_advisory_detail\?utsa_id=UTSA-2024-003941$',
    '^https?://ubuntukylin\.com/news/397-cn\.html$',
    '^https?://www\.goupsec\.com/news/17579\.html$',
    '^https?://get\.posixcertified\.ieee\.org/docs/POSIX_Certification_Policy_v1\.1\.pdf$',
    '^https?://www\.leidinger\.net/blog/2025/05/24/freebsd-security-hardening-with-compiler-options/?$',
    # 原讨论帖已失效，正文为便于考据保留原址
    '^https?://forum\.openwrt\.org/viewtopic\.php\?pid=70060$',
    # 代码块与行内代码中的语法示例，并非真实链接
    '^ssh://',
    '^file://',
    '.*X\.Y-(RELEASE|STABLE).*',
    '^https?://xx+x\.yyy(/|$)',
    '^https://github\.com/ykla/slackware-WSL/releases/download/auto-\d+$',
    '^https?://book\.bsdcn\.org/changel',
    '^https?://cgit\.freebsd\.org/src/commit/\?id=NNNNNN$',
    # QQ 官方直链随版本滚动失效，正文已注明从官方下载页获取最新链接；微信等其他路径仍照常检查
    '^https?://dldir1(v6)?\.qq\.com/qqfile/qq/QQNT/Linux/',
    # GitHub 对该 issue 偶发返回 404，经核实真实存在
    '^https://github\.com/facebook/zstd/issues/1526$',
]

# Exclude these filesystem paths from getting checked.
exclude_path = [".github"]

# URLs to check (supports regex). Has preference over all excludes.
#include = ['gist\.github\.com.*']

# Exclude all private IPs from checking.
# Equivalent to setting `exclude_private`, `exclude_link_local`, and
# `exclude_loopback` to true.
exclude_all_private = true

# Exclude private IP address ranges from checking.
exclude_private = true

# Exclude link-local IP address range from checking.
exclude_link_local = true

# Exclude loopback IP address range and localhost from checking.
exclude_loopback = true

# Check mail addresses
# include_mail = true
