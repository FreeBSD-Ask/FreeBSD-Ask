name: 🔗 AutoCorrect 空格语法检查

permissions:
  contents: write        # 创建分支与提交
  pull-requests: write   # 创建 Pull Request
  issues: write          # 为 Pull Request 添加标签

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: AutoCorrect
    runs-on: ubuntu-latest
    
    steps:
        - name: Checkout from repository
          uses: actions/checkout@v7
        
        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '24'
          
        - name: Install nodejs dependencies
          run: yarn add autocorrect-node
        
        - name: Run autocorrect lint
          run: yarn autocorrect --config .github/.autocorrectrc --lint --no-diff-bg-color **/*.md  || true 
          
        - name: Run autocorrect fix
          run: yarn autocorrect --config .github/.autocorrectrc --fix **/*.md

        - name: Markdown add spaces
          uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
          with:
             commit-message: "Markdown add spaces"
             labels: "Markdown"
             delete-branch: true
             title: Markdown add spaces
             body: 格式化——Markdown 自动加空格
