name: 🔗 链接检查

permissions:
  contents: read   # 检出仓库
  issues: write    # 创建链接检查报告 issue

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 15 * *"

concurrency:
  group: linkChecker
  # 串行化检查与建 issue，避免重叠运行各自新建报告。
  # 注意 GitHub 并发组并非 FIFO 队列：最多保留一个等待中的运行，更晚到达的运行会替换它；
  # 被替换的运行由下一次定时或手动触发补足（报告已按 ref 分离，不影响正确性）
  cancel-in-progress: false

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # 失败时不中断工作流，由下一步依据退出码决定是否建 issue
          fail: false
          format: markdown
          output: ./lychee/out.md
          args: --config ./.github/lychee.toml './**/*.md'

      # 死链持续存在时，复用既有开放报告 issue 而非每次运行都新建，避免重复累积；
      # 默认分支的报告使用固定标题，其他 ref 的报告带完整 ref 后缀，防止不同 ref 的运行互相覆盖报告
      - name: 查找现有报告 issue
        id: find_issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // 非 main 的报告使用完整 ref（refs/heads/… 或 refs/tags/…）作后缀，避免分支与同名标签共用同一份报告；
            // 标题须低于 GitHub 的 256 字符限制，超长 ref 截断并附提交短哈希以保持可区分
            const refLabel = context.ref.length > 180
              ? `${context.ref.slice(0, 160)}…${context.sha.slice(0, 7)}`
              : context.ref;
            const reportTitle = context.ref === 'refs/heads/main'
              ? 'Link Checker Report'
              : `Link Checker Report (${refLabel})`;
            core.setOutput('title', reportTitle);
            // 用 paginate 取回所有分页，防止报告 issue 位于第一页之外而被漏查
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'report, automated issue'
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === reportTitle);
            core.setOutput('number', existing ? String(existing.number) : '');

      # issue-number 为空时新建，非空时更新对应 issue
      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: ${{ steps.find_issue.outputs.title }}
          content-filepath: ./lychee/out.md
          labels: report, automated issue
          issue-number: ${{ steps.find_issue.outputs.number }}
