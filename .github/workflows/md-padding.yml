name: 🔗 md-padding 自动加空格

permissions:
  contents: write        # 创建分支与提交
  pull-requests: write   # 创建 Pull Request
  issues: write          # 为 Pull Request 添加标签

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: md-padding
    runs-on: ubuntu-latest
    
    steps:
        - name: Checkout from repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
        - name: Setup Node.js
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
            node-version: '24'
          
        - name: Install Node.js dependencies 
          run: npm i -g --ignore-scripts md-padding@1.10.0
        
        - name: Run md-padding lint
          run: find "$(pwd)" -type f -name "*.md" | md-padding --ignore-words='-' ':' '>' '=' '<' -f --read-files -i

        - name: Markdown add spaces
          uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
          with:
             commit-message: "Markdown add spaces"
             labels: "Markdown"
             delete-branch: true
             title: Markdown add spaces
             body: 格式化——使用 md-padding 给 Markdown 自动加空格
