name: 🔗 更新谷歌分析

permissions:
  contents: write   # 提交并推送 README 统计数据

on:
  schedule:
    - cron: '10 15 1 * *'  # 每月 1 日 15:10 运行（UTC 时间）
  workflow_dispatch:

jobs:
  update-ga4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: "pip install --only-binary :all: google-analytics-data==0.23.3 requests==2.34.2 packaging==26.4"

      - name: Update README with GA4 data
        env:
          GA4_SERVICE_KEY: ${{ secrets.GA4_SERVICE_KEY }}
        run: |
          python .github/scripts/update_ga4_readme.py
          # 自动提交并推送（只提交 README.md）
          if [ -n "$(git status --porcelain "README.md")" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "README.md"
          git commit -m "CI: 更新谷歌分析"
          git push origin main
          fi
