name: "🔗 检查 Markdown 图片引用"

permissions:
  contents: read   # 检出仓库
  issues: write    # 创建图片检查报告 issue

on:
  push:
    paths:
      - '.gitbook/assets/**'
  workflow_dispatch:

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'

      - name: Run image check script
        id: image-check
        run: |
          pip install --only-binary :all: regex==2026.11.25
          python .github/scripts/check_images.py

          # 判断报告是否存在且不为空
          if [ -s image-report.md ]; then
            echo "report_exists=1" >> $GITHUB_OUTPUT
          else
            echo "report_exists=0" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue
        if: steps.image-check.outputs.report_exists == '1'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "图片检查报告"
          content-filepath: ./image-report.md
          labels: report, automation
