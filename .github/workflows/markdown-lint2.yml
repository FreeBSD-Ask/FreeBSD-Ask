name: 🔗 markdownlint-cli2 语法检查

permissions:
  contents: write        # 创建分支与提交
  pull-requests: write   # 创建 Pull Request
  issues: write          # 为 Pull Request 添加标签

# Disable automatic runs
on: [workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          config: '.github/.markdownlint.json'
          fix: true
          globs: '**/*.md'

      - name: markdownlint cli2 RP
        if: failure()
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "Markdown 格式化"
          labels: "Markdown"
          delete-branch: true
          title: markdownlint
          body: |
            格式化——Markdown