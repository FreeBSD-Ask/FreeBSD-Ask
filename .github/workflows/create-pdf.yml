name: 🔗 创建并发布 PDF & EPUB

permissions:
  contents: write        # 推送标签、创建与更新 Release
  issues: read           # 读取 issue 生成变更日志
  pull-requests: read    # 读取 Pull Request 生成变更日志

on:
  schedule:
    - cron: '30 15 * * 0'  # 每周日 UTC 时间 15:30 运行
  workflow_dispatch:       # 可手动触发

concurrency:
  group: create-pdf-publish
  # 后到运行排队等待而非取消前者，串行化发布，避免重叠运行互相覆盖标签与 Release
  cancel-in-progress: false

jobs:
  build:
    # 仅允许从默认分支发布，防止手动触发时把日期标签与 Release 改写为非默认分支的内容
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      # ================= 字体安装部分 =================
      - name: 安装字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei ttf-wqy-zenhei fonts-noto-core fonts-noto-cjk

      - name: 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          timedatectl

      # ================= 仓库检出部分 =================
      - name: 检出 FreeBSD-Ask 主仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: FreeBSD-Ask
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 检出 gitbook-pdf-export 工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FreeBSD-Ask/gitbook-pdf-export
          path: pdf-generator

      # ================= 初始化标签检查 =================
      - name: 检查或创建初始标签
        working-directory: FreeBSD-Ask
        run: |
          timedatectl
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "创建初始标签 v0.0.0"
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            git tag v0.0.0
            git push origin v0.0.0
          fi

      # ================= 环境配置部分 =================
      - name: 设置 Python 环境
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          check-latest: true

      - name: 安装 Python 依赖
        run: |
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0
          # 直接采用 pdf-generator 的 requirements.txt：python-docx 必需，
          # 且上游刻意收紧版本上限（mdconv 会 patch WeasyPrint 内部）
          pip install -r pdf-generator/requirements.txt
      # ================= PDF 生成部分 =================
      - name: 生成 PDF 文档
        run: |
          cd pdf-generator
          python mdconv.py ../FreeBSD-Ask
          mv build/final.pdf build/$(date +'%Y.%m.%d').pdf
          mv build/final.epub build/$(date +'%Y.%m.%d').epub
        env:
          PYTHONPATH: ${{ github.workspace }}/pdf-generator
      # ================= 发布流程部分 =================
      - name: 🚀 设置发布日期标签
        id: set_tag
        run: echo "RELEASE_TAG=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: 🔍 判断当日是否已发布
        id: publish_state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setOutput('skip', 'true');
              core.info(`Release ${tag} 已存在，当日已发布，跳过发布流程`);
            } catch (err) {
              if (err.status === 404) {
                core.setOutput('skip', 'false');
                core.info(`Release ${tag} 不存在，继续发布流程`);
              } else {
                throw err;
              }
            }

      - name: 🔍 获取前一个标签 (优化版本)
        if: steps.publish_state.outputs.skip != 'true'
        working-directory: FreeBSD-Ask
        run: |
          git fetch --tags --force
          TAG_PATTERN="20??.??.??"
          PREVIOUS_TAG=$(git tag -l "$TAG_PATTERN" \
            | grep -v "${{ env.RELEASE_TAG }}" \
            | sort -V \
            | tail -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "警告：未找到匹配的先前标签，将使用默认基准标签 'v0.0.0'"
            PREVIOUS_TAG="v0.0.0"
          fi
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV

      - name: 调试 - 检查提取到的标签值
        if: steps.publish_state.outputs.skip != 'true'
        run: |
          echo "本次发布标签 (RELEASE_TAG): ${{ env.RELEASE_TAG }}"
          echo "上次发布标签 (PREVIOUS_TAG): ${{ env.PREVIOUS_TAG }}"
          echo "------------------------------------------------------"

      - name: 🏷️ 创建 Git 标签并推送
        if: steps.publish_state.outputs.skip != 'true'
        working-directory: FreeBSD-Ask
        run: |
          timedatectl
          git config --global user.email "yklaxds@gmail.com"
          git config --global user.name "ykla"
          # 此步骤仅在当日 Release 尚未发布时执行：标签已存在说明上次运行失败于发布阶段，
          # 重置到当前 HEAD 使标签与本次构建内容一致；当日 Release 已发布的场景已被上面的跳过判断拦截，不会改写已发布版本
          if git rev-parse -q --verify "refs/tags/${{ env.RELEASE_TAG }}" >/dev/null; then
            echo "标签 ${{ env.RELEASE_TAG }} 已存在且当日 Release 未发布，强制重置到当前 HEAD"
            git tag -f ${{ env.RELEASE_TAG }} HEAD
            git push --force origin ${{ env.RELEASE_TAG }}
          else
            git tag ${{ env.RELEASE_TAG }}
            git push origin ${{ env.RELEASE_TAG }}
          fi

      - name: 📜 生成增量变更日志
        if: steps.publish_state.outputs.skip != 'true'
        uses: janheinrichmerker/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f # v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sinceTag: ${{ env.PREVIOUS_TAG }}
          user: FreeBSD-Ask
          repo: FreeBSD-Ask

      - name: 📥 读取变更日志内容
        id: read_changelog
        if: steps.publish_state.outputs.skip != 'true'
        run: |
          timedatectl
          CHANGES=$(cat CHANGELOG.md | sed 's/\"/\\"/g')
          echo "CHANGES_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: ✨ 创建 GitHub Release
        if: steps.publish_state.outputs.skip != 'true'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        id: create_release
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          artifacts: |
            pdf-generator/build/${{ env.RELEASE_TAG }}.pdf
            pdf-generator/build/${{ env.RELEASE_TAG }}.epub
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
          # 常规路径已由“判断当日是否已发布”保证 Release 不存在；此处允许更新作为兜底，
          # 若 Release 被先行创建则更新而非失败；replacesArtifacts 默认为 true，附件自动替换
          allowUpdates: true

      - name: 📝 更新 Release 说明 (包含变更日志)
        if: steps.publish_state.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG
            });
            console.log(`找到 Release ID: ${release.id}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: process.env.CHANGES_CONTENT
            });
            console.log('Release body 更新完成。');
