name: 🔗 CodeQL 安全分析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周日 UTC 01:30
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read         # 检出仓库
  security-events: write # 上传 CodeQL 分析结果

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # 以下场景 GITHUB_TOKEN 为只读，无法上传分析结果，须跳过：
    # fork 仓库的 PR、dependabot[bot] 创建的 PR（维护者重跑时事件 payload 不变，判断依然生效）
    if: >-
      github.event_name != 'pull_request'
      || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 分析仓库中 CodeQL 支持的全部语言：GitHub Actions 工作流、
        # JavaScript/TypeScript（.vitepress 下的 ESM 配置与主题）、Python（.github/scripts 下的脚本）；
        # CSS、Vue 单文件组件、Markdown、JSON、TOML 等不在 CodeQL 支持范围内
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        env:
          # JS 提取器默认跳过隐藏目录（仅 .github 例外），将 .vitepress 设为提取根以纳入 JS/TS 源码；
          # 提取根本身不受隐藏目录规则限制。其他语言保持默认仓库根（空值不覆盖）
          LGTM_INDEX_INCLUDE: ${{ matrix.language == 'javascript-typescript' && '.vitepress' || '' }}
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # threat-model 不是 init 的输入参数，须经 config 传入（代码扫描默认即 remote_and_local，此处显式声明）
          config: |
            threat-model: remote_and_local

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        env:
          LGTM_INDEX_INCLUDE: ${{ matrix.language == 'javascript-typescript' && '.vitepress' || '' }}
        with:
          category: "/language:${{ matrix.language }}"
