name: 🔗 CodeQL 安全分析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周日 UTC 01:30
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read         # 检出仓库
  security-events: write # 上传 CodeQL 分析结果

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # dependabot 提交的 PR 上 GITHUB_TOKEN 只读，上传分析结果会失败，故跳过
    if: github.triggering_actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          # 仅分析 GitHub Actions 工作流；仓库无 package.json，
          # javascript-typescript 会因无法解析 ESM 而报错，勿启用
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          threat-model: remote_and_local

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
